<!DOCTYPE html>
<html>
<head>
  <title>Bitcointalk BBCode Extension</title>
</head>
<body>
  <h3>Bitcointalk BBCode Extension</h1>
  <ul style="
    padding-left: 10px;
    width: 250px;
">
	  <li>To make text bold press Ctrl + B.</li>
	  <li>To make text italic press Ctrl + I.</li>
	  <li>To increase the font size Ctrl + Up.</li>
	  <li>To decrease the font size Ctrl + Down.</li>
	  <li>To undo the last BBCode change press Ctrl + Z.</li>
  </ul>
</body>
</html>
